openapi: 3.1.0
info:
  title: Think64 chess truth API
  version: 0.2.0
  summary: The contract between the chess truth service (Person 1) and the coach and product (Person 2).
  description: |
    Everything that crosses the boundary between the two halves of Think64 is defined here.
    This file is the single source of truth: the TypeScript and Python types, the mock server
    and the contract tests are all derived from it.

    Conventions (decided in week 1, change only by bumping the version):
    - All endpoints take and return JSON. Field names are snake_case.
    - Moves are sent as UCI (`e2e4`, `e7e8q`, castling as `e1g1`). Every move the API returns
      carries both `uci` and `san`.
    - A position is always sent as a start FEN plus the moves played from it (`PositionRef`),
      never as a bare FEN, so repetition and draw rules can be detected.
    - Scores are always from White's point of view. `cp` is centipawns; `mate` is the number of
      moves until mate, positive when White mates and negative when Black mates.
    - Illegal user input inside a valid request (an illegal move, a false claim) is a normal
      200 response. HTTP errors are only for malformed requests or service failures.
    - Every successful response carries `schema_version`.
servers:
  - url: http://localhost:8064
    description: Mock server (mock/server.py) or local chess truth service
tags:
  - name: rules
    description: Deterministic board logic. Fast, no engine.
  - name: engine
    description: Stockfish-backed. Slower; accepts `limits`.

paths:
  /v1/health:
    get:
      operationId: health
      tags: [rules]
      summary: Service status, schema version and engine identity.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /v1/position:
    post:
      operationId: describePosition
      tags: [rules]
      summary: Validate a position and describe it - status, legal moves, material, facts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PositionRequest" }
      responses:
        "200":
          description: Position described
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/move:
    post:
      operationId: playMove
      tags: [rules]
      summary: Check one move and return the position after it. An illegal move is a 200 with `legal false`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: Move checked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoveResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/analyze:
    post:
      operationId: analyzePosition
      tags: [engine]
      summary: Engine analysis with MultiPV candidate lines.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyzeRequest" }
      responses:
        "200":
          description: Analysis finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /v1/compare:
    post:
      operationId: compareMoves
      tags: [engine]
      summary: Compare specific candidate moves against the engine's best move, with structured differences.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompareRequest" }
      responses:
        "200":
          description: Comparison finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompareResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /v1/verify:
    post:
      operationId: verifyClaims
      tags: [engine]
      summary: Check chess claims made by the coach before they reach the user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses:
        "200":
          description: Claims checked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /v1/game:
    post:
      operationId: parseGame
      tags: [rules]
      summary: Parse a PGN into a move tree (mainline and variations), with a ready PositionRef for every node.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameRequest" }
      responses:
        "200":
          description: Game parsed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }

components:
  responses:
    Unprocessable:
      description: Request is well-formed JSON but cannot be processed (bad FEN, illegal move in history, bad PGN, schema violation).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    EngineUnavailable:
      description: The engine is not running or timed out.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ---------- primitives ----------
    SchemaVersion:
      type: string
      pattern: "^0\\.2\\.\\d+$"
      description: Contract version. Minor bumps may add fields; anything else is a breaking change.
    Square:
      type: string
      pattern: "^[a-h][1-8]$"
    File:
      type: string
      enum: [a, b, c, d, e, f, g, h]
    UciMove:
      type: string
      pattern: "^[a-h][1-8][a-h][1-8][qrbn]?$"
    Color:
      type: string
      enum: [white, black]
    PieceType:
      type: string
      enum: [king, queen, rook, bishop, knight, pawn]
    Piece:
      type: object
      description: A piece standing on a square.
      additionalProperties: false
      required: [square, type, color]
      properties:
        square: { $ref: "#/components/schemas/Square" }
        type: { $ref: "#/components/schemas/PieceType" }
        color: { $ref: "#/components/schemas/Color" }
    Move:
      type: object
      additionalProperties: false
      required: [uci, san]
      properties:
        uci: { $ref: "#/components/schemas/UciMove" }
        san: { type: string, minLength: 2, examples: ["Nf3", "exd5", "O-O", "e8=Q+"] }

    # ---------- positions ----------
    PositionRef:
      type: object
      description: |
        How a position is sent to the API: a starting FEN plus the moves played from it.
        For a set-up position with no history, send its FEN as `start_fen` and an empty `moves`.
        Repetition can only be detected when the history is included.
      additionalProperties: false
      required: [moves]
      properties:
        start_fen:
          type: string
          default: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
        moves:
          type: array
          items: { $ref: "#/components/schemas/UciMove" }
          default: []
    Position:
      type: object
      description: The position reached after applying all moves of a PositionRef.
      additionalProperties: false
      required: [fen, side_to_move, fullmove_number, halfmove_clock, ply]
      properties:
        fen: { type: string }
        side_to_move: { $ref: "#/components/schemas/Color" }
        fullmove_number: { type: integer, minimum: 1 }
        halfmove_clock: { type: integer, minimum: 0 }
        ply: { type: integer, minimum: 0, description: Number of moves applied from start_fen. }
    GameStatus:
      type: object
      additionalProperties: false
      required: [state, is_game_over, in_check, winner, claimable_draws]
      properties:
        state:
          type: string
          enum: [ongoing, checkmate, stalemate, insufficient_material, fivefold_repetition, seventyfive_moves]
        is_game_over: { type: boolean }
        in_check: { type: boolean, description: Whether the side to move is in check. }
        winner:
          oneOf:
            - { $ref: "#/components/schemas/Color" }
            - { type: "null" }
        claimable_draws:
          type: array
          description: Draws the side to move may claim but which do not end the game automatically.
          items:
            type: string
            enum: [threefold_repetition, fifty_moves]
    MaterialCount:
      type: object
      additionalProperties: false
      required: [pawn, knight, bishop, rook, queen]
      properties:
        pawn: { type: integer, minimum: 0 }
        knight: { type: integer, minimum: 0 }
        bishop: { type: integer, minimum: 0 }
        rook: { type: integer, minimum: 0 }
        queen: { type: integer, minimum: 0 }
    Material:
      type: object
      additionalProperties: false
      required: [white, black, balance_cp]
      properties:
        white: { $ref: "#/components/schemas/MaterialCount" }
        black: { $ref: "#/components/schemas/MaterialCount" }
        balance_cp:
          type: integer
          description: White minus Black using pawn 100, knight 300, bishop 300, rook 500, queen 900.

    # ---------- facts (relational state) ----------
    ChessFact:
      description: One objective relationship on the board. New kinds may be added in minor versions; clients ignore kinds they do not know.
      oneOf:
        - { $ref: "#/components/schemas/CheckFact" }
        - { $ref: "#/components/schemas/PinFact" }
        - { $ref: "#/components/schemas/XrayFact" }
        - { $ref: "#/components/schemas/HangingFact" }
        - { $ref: "#/components/schemas/OpenFileFact" }
        - { $ref: "#/components/schemas/SemiOpenFileFact" }
      discriminator:
        propertyName: kind
        mapping:
          check: "#/components/schemas/CheckFact"
          pin: "#/components/schemas/PinFact"
          xray: "#/components/schemas/XrayFact"
          hanging: "#/components/schemas/HangingFact"
          open_file: "#/components/schemas/OpenFileFact"
          semi_open_file: "#/components/schemas/SemiOpenFileFact"
    CheckFact:
      type: object
      additionalProperties: false
      required: [kind, checker, king]
      properties:
        kind: { const: check }
        checker: { $ref: "#/components/schemas/Piece" }
        king: { $ref: "#/components/schemas/Piece" }
    PinFact:
      type: object
      description: |
        `pinned` stands between an enemy slider (`pinner`) and its own `shielded` piece.
        Absolute pin: `shielded` is the king, so moves off the ray are illegal.
        Relative pin: `shielded` is worth more than `pinned`; moving is legal but loses material on the ray.
      additionalProperties: false
      required: [kind, pinned, pinner, shielded, absolute, ray]
      properties:
        kind: { const: pin }
        pinned: { $ref: "#/components/schemas/Piece" }
        pinner: { $ref: "#/components/schemas/Piece" }
        shielded: { $ref: "#/components/schemas/Piece" }
        absolute: { type: boolean }
        ray:
          type: array
          description: Squares from pinner to shielded, both included.
          items: { $ref: "#/components/schemas/Square" }
    XrayFact:
      type: object
      description: A slider would attack `target` if its own piece `blocker` moved away (discovered-attack potential).
      additionalProperties: false
      required: [kind, attacker, blocker, target]
      properties:
        kind: { const: xray }
        attacker: { $ref: "#/components/schemas/Piece" }
        blocker: { $ref: "#/components/schemas/Piece" }
        target: { $ref: "#/components/schemas/Piece" }
    HangingFact:
      type: object
      description: A non-king piece attacked by at least one enemy piece that can really capture it, and defended by none. Absolutely pinned pieces that cannot capture along their pin do not count as attackers or defenders.
      additionalProperties: false
      required: [kind, piece, attackers]
      properties:
        kind: { const: hanging }
        piece: { $ref: "#/components/schemas/Piece" }
        attackers:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Piece" }
    OpenFileFact:
      type: object
      additionalProperties: false
      required: [kind, file]
      properties:
        kind: { const: open_file }
        file: { $ref: "#/components/schemas/File" }
    SemiOpenFileFact:
      type: object
      description: The file has no pawns of `open_for` but has pawns of the other side.
      additionalProperties: false
      required: [kind, file, open_for]
      properties:
        kind: { const: semi_open_file }
        file: { $ref: "#/components/schemas/File" }
        open_for: { $ref: "#/components/schemas/Color" }

    PieceInfo:
      type: object
      description: |
        Per-piece view that separates geometry from legality.
        `attacks` is geometric (what the piece hits by its movement pattern, pins ignored).
        `legal_moves` is what can actually be played now, and is always empty for the side not to move.
      additionalProperties: false
      required: [piece, attacks, legal_moves, attacked_by, defended_by, pin]
      properties:
        piece: { $ref: "#/components/schemas/Piece" }
        attacks:
          type: array
          items: { $ref: "#/components/schemas/Square" }
        legal_moves:
          type: array
          items: { $ref: "#/components/schemas/Move" }
        attacked_by:
          type: array
          items: { $ref: "#/components/schemas/Piece" }
        defended_by:
          type: array
          items: { $ref: "#/components/schemas/Piece" }
        pin:
          oneOf:
            - type: object
              additionalProperties: false
              required: [pinner, shielded, absolute]
              properties:
                pinner: { $ref: "#/components/schemas/Piece" }
                shielded: { $ref: "#/components/schemas/Piece" }
                absolute: { type: boolean }
            - { type: "null" }

    # ---------- engine ----------
    Score:
      type: object
      additionalProperties: false
      required: [type, value, pov]
      properties:
        type: { type: string, enum: [cp, mate] }
        value:
          type: integer
          description: Centipawns, or moves to mate (positive = White mates, negative = Black mates).
        pov: { const: white }
    Limits:
      type: object
      description: Search limits. If none of depth, movetime_ms or nodes is set, the server uses depth 16.
      additionalProperties: false
      properties:
        depth: { type: integer, minimum: 1, maximum: 40 }
        movetime_ms: { type: integer, minimum: 10, maximum: 30000 }
        nodes: { type: integer, minimum: 1000 }
        multipv: { type: integer, minimum: 1, maximum: 5, default: 3 }
    EngineInfo:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string, description: '"Stockfish" for real analysis, "mock" for the mock server.' }
        version: { type: string }
    CandidateLine:
      type: object
      additionalProperties: false
      required: [rank, move, score, pv, depth]
      properties:
        rank: { type: integer, minimum: 1, description: 1 = engine's best move. }
        move: { $ref: "#/components/schemas/Move" }
        score: { $ref: "#/components/schemas/Score" }
        pv:
          type: array
          minItems: 1
          description: Principal variation, starting with `move`.
          items: { $ref: "#/components/schemas/Move" }
        depth: { type: integer, minimum: 1 }
    EngineAnalysis:
      type: object
      additionalProperties: false
      required: [engine, depth, nodes, time_ms, multipv, candidates]
      properties:
        engine: { $ref: "#/components/schemas/EngineInfo" }
        depth: { type: integer, minimum: 0 }
        nodes: { type: integer, minimum: 0 }
        time_ms: { type: integer, minimum: 0 }
        multipv: { type: integer, minimum: 1 }
        candidates:
          type: array
          description: Best first. Empty when the game is over.
          items: { $ref: "#/components/schemas/CandidateLine" }

    Difference:
      description: One structured change between the root position and a candidate line. Person 2 explains these; Person 1 computes them.
      oneOf:
        - { $ref: "#/components/schemas/MaterialDifference" }
        - { $ref: "#/components/schemas/FactCreatedDifference" }
        - { $ref: "#/components/schemas/FactRemovedDifference" }
        - { $ref: "#/components/schemas/MateDifference" }
      discriminator:
        propertyName: kind
        mapping:
          material: "#/components/schemas/MaterialDifference"
          fact_created: "#/components/schemas/FactCreatedDifference"
          fact_removed: "#/components/schemas/FactRemovedDifference"
          mate: "#/components/schemas/MateDifference"
    MaterialDifference:
      type: object
      description: Material balance at the root versus at the end of the line's PV.
      additionalProperties: false
      required: [kind, balance_cp_before, balance_cp_after, after_plies]
      properties:
        kind: { const: material }
        balance_cp_before: { type: integer }
        balance_cp_after: { type: integer }
        after_plies: { type: integer, minimum: 1 }
    FactCreatedDifference:
      type: object
      description: A fact that exists after `at_ply` plies of the line but not at the root.
      additionalProperties: false
      required: [kind, at_ply, fact]
      properties:
        kind: { const: fact_created }
        at_ply: { type: integer, minimum: 1 }
        fact: { $ref: "#/components/schemas/ChessFact" }
    FactRemovedDifference:
      type: object
      description: A fact that exists at the root but is gone after `at_ply` plies.
      additionalProperties: false
      required: [kind, at_ply, fact]
      properties:
        kind: { const: fact_removed }
        at_ply: { type: integer, minimum: 1 }
        fact: { $ref: "#/components/schemas/ChessFact" }
    MateDifference:
      type: object
      additionalProperties: false
      required: [kind, in_moves, winner]
      properties:
        kind: { const: mate }
        in_moves: { type: integer, minimum: 0 }
        winner: { $ref: "#/components/schemas/Color" }
    ComparedLine:
      type: object
      additionalProperties: false
      required: [move, score, pv, loss_cp, is_best, differences]
      properties:
        move: { $ref: "#/components/schemas/Move" }
        score: { $ref: "#/components/schemas/Score" }
        pv:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Move" }
        loss_cp:
          type: integer
          minimum: 0
          description: How much worse than the best move, in centipawns from the mover's view. Mate scores count as 10000.
        is_best: { type: boolean }
        differences:
          type: array
          items: { $ref: "#/components/schemas/Difference" }

    # ---------- verification ----------
    Claim:
      description: A checkable statement the coach wants to make. `id` is chosen by the caller and echoed back.
      oneOf:
        - { $ref: "#/components/schemas/LegalMoveClaim" }
        - { $ref: "#/components/schemas/LegalLineClaim" }
        - { $ref: "#/components/schemas/PieceOnClaim" }
        - { $ref: "#/components/schemas/AttacksClaim" }
        - { $ref: "#/components/schemas/DefendsClaim" }
        - { $ref: "#/components/schemas/PinnedClaim" }
        - { $ref: "#/components/schemas/HangingClaim" }
        - { $ref: "#/components/schemas/InCheckClaim" }
        - { $ref: "#/components/schemas/MateInClaim" }
        - { $ref: "#/components/schemas/BestMoveClaim" }
        - { $ref: "#/components/schemas/BetterThanClaim" }
        - { $ref: "#/components/schemas/MaterialBalanceClaim" }
        - { $ref: "#/components/schemas/OpenFileClaim" }
        - { $ref: "#/components/schemas/BishopPairClaim" }
        - { $ref: "#/components/schemas/DoubledPawnsClaim" }
        - { $ref: "#/components/schemas/IsolatedPawnClaim" }
        - { $ref: "#/components/schemas/PassedPawnClaim" }
      discriminator:
        propertyName: type
        mapping:
          legal_move: "#/components/schemas/LegalMoveClaim"
          legal_line: "#/components/schemas/LegalLineClaim"
          piece_on: "#/components/schemas/PieceOnClaim"
          attacks: "#/components/schemas/AttacksClaim"
          defends: "#/components/schemas/DefendsClaim"
          pinned: "#/components/schemas/PinnedClaim"
          hanging: "#/components/schemas/HangingClaim"
          in_check: "#/components/schemas/InCheckClaim"
          mate_in: "#/components/schemas/MateInClaim"
          best_move: "#/components/schemas/BestMoveClaim"
          better_than: "#/components/schemas/BetterThanClaim"
          material_balance: "#/components/schemas/MaterialBalanceClaim"
          open_file: "#/components/schemas/OpenFileClaim"
          bishop_pair: "#/components/schemas/BishopPairClaim"
          doubled_pawns: "#/components/schemas/DoubledPawnsClaim"
          isolated_pawn: "#/components/schemas/IsolatedPawnClaim"
          passed_pawn: "#/components/schemas/PassedPawnClaim"
    LegalMoveClaim:
      type: object
      additionalProperties: false
      required: [id, type, move]
      properties:
        id: { type: string }
        type: { const: legal_move }
        move: { $ref: "#/components/schemas/UciMove" }
    LegalLineClaim:
      type: object
      additionalProperties: false
      required: [id, type, moves]
      properties:
        id: { type: string }
        type: { const: legal_line }
        moves:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/UciMove" }
    PieceOnClaim:
      type: object
      additionalProperties: false
      required: [id, type, square, piece_type, color]
      properties:
        id: { type: string }
        type: { const: piece_on }
        square: { $ref: "#/components/schemas/Square" }
        piece_type: { $ref: "#/components/schemas/PieceType" }
        color: { $ref: "#/components/schemas/Color" }
    AttacksClaim:
      type: object
      description: The piece on `from` geometrically attacks `to` (pins ignored).
      additionalProperties: false
      required: [id, type, from, to]
      properties:
        id: { type: string }
        type: { const: attacks }
        from: { $ref: "#/components/schemas/Square" }
        to: { $ref: "#/components/schemas/Square" }
    DefendsClaim:
      type: object
      description: The piece on `from` geometrically protects its own piece on `to`.
      additionalProperties: false
      required: [id, type, from, to]
      properties:
        id: { type: string }
        type: { const: defends }
        from: { $ref: "#/components/schemas/Square" }
        to: { $ref: "#/components/schemas/Square" }
    PinnedClaim:
      type: object
      additionalProperties: false
      required: [id, type, square]
      properties:
        id: { type: string }
        type: { const: pinned }
        square: { $ref: "#/components/schemas/Square" }
        absolute: { type: boolean, description: If set, the pin must also be of this kind. }
    HangingClaim:
      type: object
      additionalProperties: false
      required: [id, type, square]
      properties:
        id: { type: string }
        type: { const: hanging }
        square: { $ref: "#/components/schemas/Square" }
    InCheckClaim:
      type: object
      additionalProperties: false
      required: [id, type, color]
      properties:
        id: { type: string }
        type: { const: in_check }
        color: { $ref: "#/components/schemas/Color" }
    MateInClaim:
      type: object
      description: "`winner` can force mate in at most `moves` moves (engine-checked)."
      additionalProperties: false
      required: [id, type, moves, winner]
      properties:
        id: { type: string }
        type: { const: mate_in }
        moves: { type: integer, minimum: 1, maximum: 20 }
        winner: { $ref: "#/components/schemas/Color" }
    BestMoveClaim:
      type: object
      description: "`move` is within `tolerance_cp` of the engine's best move (engine-checked)."
      additionalProperties: false
      required: [id, type, move]
      properties:
        id: { type: string }
        type: { const: best_move }
        move: { $ref: "#/components/schemas/UciMove" }
        tolerance_cp: { type: integer, minimum: 0, default: 30 }
    BetterThanClaim:
      type: object
      description: "`move` scores better for the side to move than `than` (engine-checked)."
      additionalProperties: false
      required: [id, type, move, than]
      properties:
        id: { type: string }
        type: { const: better_than }
        move: { $ref: "#/components/schemas/UciMove" }
        than: { $ref: "#/components/schemas/UciMove" }
    # Structural claims (v0.2). Rules-only and deterministic: no engine involved.
    MaterialBalanceClaim:
      type: object
      description: "Material balance (White minus Black, pawn 100 / minor 300 / rook 500 / queen 900, as in Material.balance_cp) equals `balance_cp`. 0 means material is equal."
      additionalProperties: false
      required: [id, type, balance_cp]
      properties:
        id: { type: string }
        type: { const: material_balance }
        balance_cp: { type: integer }
    OpenFileClaim:
      type: object
      description: "`open_for` null: the file has no pawns at all (an open file). `open_for` a colour: the file has no pawns of that colour but has pawns of the other (semi-open for that side), as in SemiOpenFileFact."
      additionalProperties: false
      required: [id, type, file, open_for]
      properties:
        id: { type: string }
        type: { const: open_file }
        file: { $ref: "#/components/schemas/File" }
        open_for:
          oneOf:
            - { $ref: "#/components/schemas/Color" }
            - { type: "null" }
    BishopPairClaim:
      type: object
      description: "`color` has bishops on both light and dark squares."
      additionalProperties: false
      required: [id, type, color]
      properties:
        id: { type: string }
        type: { const: bishop_pair }
        color: { $ref: "#/components/schemas/Color" }
    DoubledPawnsClaim:
      type: object
      description: "`color` has two or more pawns on `file`."
      additionalProperties: false
      required: [id, type, color, file]
      properties:
        id: { type: string }
        type: { const: doubled_pawns }
        color: { $ref: "#/components/schemas/Color" }
        file: { $ref: "#/components/schemas/File" }
    IsolatedPawnClaim:
      type: object
      description: "There is a pawn on `square` and its side has no pawns on the adjacent files."
      additionalProperties: false
      required: [id, type, square]
      properties:
        id: { type: string }
        type: { const: isolated_pawn }
        square: { $ref: "#/components/schemas/Square" }
    PassedPawnClaim:
      type: object
      description: "There is a pawn on `square` and no enemy pawn stands in front of it on its own or an adjacent file."
      additionalProperties: false
      required: [id, type, square]
      properties:
        id: { type: string }
        type: { const: passed_pawn }
        square: { $ref: "#/components/schemas/Square" }
    ClaimResult:
      type: object
      additionalProperties: false
      required: [id, verdict, reason]
      properties:
        id: { type: string }
        verdict:
          type: string
          enum: [supported, refuted, unverifiable]
          description: "`unverifiable` means the service could not decide (for example the engine is unavailable). The coach must not state an unverifiable claim as fact."
        reason: { type: string, description: Short machine-generated explanation, safe to show in logs. }
        facts:
          type: array
          description: Facts that back the verdict, when there are any.
          items: { $ref: "#/components/schemas/ChessFact" }

    # ---------- games ----------
    GameNode:
      type: object
      additionalProperties: false
      required: [id, parent_id, ply, move, fen_after, position, is_mainline, children, comment, nags]
      properties:
        id: { type: string }
        parent_id:
          type: [string, "null"]
          description: null when the move is played from the start position.
        ply: { type: integer, minimum: 1 }
        move: { $ref: "#/components/schemas/Move" }
        fen_after: { type: string }
        position:
          $ref: "#/components/schemas/PositionRef"
          description: Ready-to-send PositionRef for the position after this move.
        is_mainline: { type: boolean }
        children:
          type: array
          description: Child node ids; the first is the main continuation.
          items: { type: string }
        comment: { type: [string, "null"] }
        nags:
          type: array
          items: { type: integer }

    # ---------- requests and responses ----------
    HealthResponse:
      type: object
      additionalProperties: false
      required: [schema_version, status, engine]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        status: { type: string, enum: [ok, degraded] }
        engine:
          oneOf:
            - { $ref: "#/components/schemas/EngineInfo" }
            - { type: "null" }
    PositionRequest:
      type: object
      additionalProperties: false
      required: [position]
      properties:
        position: { $ref: "#/components/schemas/PositionRef" }
        include:
          type: object
          additionalProperties: false
          properties:
            legal_moves: { type: boolean, default: true }
            facts: { type: boolean, default: true }
            pieces: { type: boolean, default: false }
    PositionResponse:
      type: object
      additionalProperties: false
      required: [schema_version, position, status, legal_moves, material, facts]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        position: { $ref: "#/components/schemas/Position" }
        status: { $ref: "#/components/schemas/GameStatus" }
        legal_moves:
          type: array
          description: Sorted by UCI. Empty if include.legal_moves is false or the game is over.
          items: { $ref: "#/components/schemas/Move" }
        material: { $ref: "#/components/schemas/Material" }
        facts:
          type: array
          items: { $ref: "#/components/schemas/ChessFact" }
        pieces:
          type: array
          description: Present only when include.pieces is true.
          items: { $ref: "#/components/schemas/PieceInfo" }
    MoveRequest:
      type: object
      additionalProperties: false
      required: [position, move]
      properties:
        position: { $ref: "#/components/schemas/PositionRef" }
        move:
          type: string
          description: The move to play. UCI by default; set notation to san to send e.g. "Nf3" (useful when the LLM wrote it).
        notation: { type: string, enum: [uci, san], default: uci }
    MoveResponse:
      type: object
      additionalProperties: false
      required: [schema_version, legal, move, next, position, status, reason]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        legal: { type: boolean }
        move:
          oneOf:
            - { $ref: "#/components/schemas/Move" }
            - { type: "null" }
        next:
          description: PositionRef for the position after the move; null if illegal.
          oneOf:
            - { $ref: "#/components/schemas/PositionRef" }
            - { type: "null" }
        position:
          oneOf:
            - { $ref: "#/components/schemas/Position" }
            - { type: "null" }
        status:
          oneOf:
            - { $ref: "#/components/schemas/GameStatus" }
            - { type: "null" }
        reason:
          description: null when legal.
          oneOf:
            - type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code: { type: string, enum: [illegal_move, unparseable_move, game_over] }
                message: { type: string }
                facts:
                  type: array
                  description: Facts that explain why, e.g. the pin that makes the move illegal.
                  items: { $ref: "#/components/schemas/ChessFact" }
            - { type: "null" }
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required: [position]
      properties:
        position: { $ref: "#/components/schemas/PositionRef" }
        limits: { $ref: "#/components/schemas/Limits" }
    AnalyzeResponse:
      type: object
      additionalProperties: false
      required: [schema_version, position, status, analysis]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        position: { $ref: "#/components/schemas/Position" }
        status: { $ref: "#/components/schemas/GameStatus" }
        analysis: { $ref: "#/components/schemas/EngineAnalysis" }
    CompareRequest:
      type: object
      additionalProperties: false
      required: [position, moves]
      properties:
        position: { $ref: "#/components/schemas/PositionRef" }
        moves:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/UciMove" }
        limits: { $ref: "#/components/schemas/Limits" }
    CompareResponse:
      type: object
      additionalProperties: false
      required: [schema_version, position, best, lines]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        position: { $ref: "#/components/schemas/Position" }
        best: { $ref: "#/components/schemas/CandidateLine" }
        lines:
          type: array
          description: One per requested move, in request order.
          items: { $ref: "#/components/schemas/ComparedLine" }
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [position, claims]
      properties:
        position: { $ref: "#/components/schemas/PositionRef" }
        claims:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/Claim" }
        limits: { $ref: "#/components/schemas/Limits" }
    VerifyResponse:
      type: object
      additionalProperties: false
      required: [schema_version, results]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        results:
          type: array
          description: One per claim, in request order.
          items: { $ref: "#/components/schemas/ClaimResult" }
    GameRequest:
      type: object
      additionalProperties: false
      required: [pgn]
      properties:
        pgn: { type: string, minLength: 1 }
    GameResponse:
      type: object
      additionalProperties: false
      required: [schema_version, headers, start_fen, result, nodes, mainline]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        headers:
          type: object
          additionalProperties: { type: string }
        start_fen: { type: string }
        result: { type: string, enum: ["1-0", "0-1", "1/2-1/2", "*"] }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/GameNode" }
        mainline:
          type: array
          description: Node ids of the main line, in order.
          items: { type: string }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_fen, illegal_move_in_history, invalid_pgn, engine_unavailable, engine_timeout, internal]
            message: { type: string }
            details: { type: object }
